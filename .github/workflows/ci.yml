name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (offline, mock provider)
        run: pytest
      - name: Run examples with the mock provider
        run: |
          python -m examples.retail_inventory.run --provider mock
          python -m examples.real_estate_listings.run --provider mock
          python -m examples.manufacturing_maintenance.run --provider mock
