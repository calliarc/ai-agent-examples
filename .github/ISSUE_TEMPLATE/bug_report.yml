name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag or commit you are using
      placeholder: v0.1.0
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, runtime versions (Python/Node/Terraform), cloud region, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant output. Remove secrets, keys and personal data first.
      render: shell
